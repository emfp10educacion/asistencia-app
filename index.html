<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Asistencia</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#FCFCFB">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@200;300;400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#2A2826;
    --paper:#FCFCFB;
    --muted:#8F8F8B;
    --muted-2:#BDBDB8;
    --muted-3:#D6D6D2;
    --brand:#D9692B;
    --brand-ink:#B8571F;
    --presente:#10677F;
    --carbon-gastado:#46413A;
    --gris-oscuro:#6B665D;
    --ink-max:#0A0806;
    --line-soft:rgba(42,40,38,.10);
    --precision-line:rgba(42,40,38,.16);
    --precision-ink:#333A40;
    --radius:0px;
    --carve: inset 0 2px 3px rgba(42,40,38,.12), inset 0 -1px 0 rgba(255,255,255,.55);
    --ease-premium: cubic-bezier(.65,0,.35,1);
    --sans:ui-rounded,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --mono:ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',monospace;
    --gutter: 28px;
    --fs-micro-mono:9.5px;
    --fs-micro:11px;
    --fs-small:13px;
    --fs-body:15px;
    --fs-heading:18px;
    --fs-display:27px;

    --gap-micro:4px;
    --gap-heading:8px;
    --pad-control:10px;
    --gap-field:12px;
    --gap-block:16px;
    --gap-close:24px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:var(--sans); font-weight:300;
    background:var(--paper); color:var(--carbon-gastado); -webkit-tap-highlight-color:transparent;
  }
  .app{max-width:480px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; background:var(--paper);}

  .login-screen{flex:1; display:flex; flex-direction:column; align-items:center; padding:40px var(--gutter) 40px;}
  .login-main{flex:1; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .login-logo{width:232px; height:auto; margin-bottom:28px;}
  .login-screen h2{font-size:var(--fs-heading); font-weight:300; margin:0 0 var(--gap-heading); text-align:center; position:relative; display:inline-block; padding-bottom:8px;}
  .login-screen h2::after{content:''; position:absolute; left:20%; right:20%; bottom:0; height:1px; background:var(--line-soft);}
  .login-screen p{font-size:var(--fs-small); font-weight:300; color:var(--gris-oscuro); text-align:center; line-height:1.6; margin:0 0 var(--gutter); max-width:230px;}
  .gbtn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; background:var(--paper); color:var(--carbon-gastado); border:1px solid var(--muted-2); border-radius:var(--radius);
    padding:10px 20px; font-size:var(--fs-body); font-weight:500; letter-spacing:.02em; font-family:inherit;
    transition:box-shadow .08s var(--ease-premium);
  }
  .gbtn .g-dot{width:8px; height:8px; border-radius:50%; border:1px solid var(--brand); background:transparent; flex-shrink:0;}
  .gbtn .gbtn-label{line-height:1;}
  .login-foot{margin-top:var(--gap-close); font-size:var(--fs-micro); font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--muted-2);}

  .select-screen{flex:1; display:flex; flex-direction:column; padding:40px var(--gutter) 20px;}
  .select-screen h2{font-size:var(--fs-display); font-weight:600; letter-spacing:.02em; margin:0 0 var(--gap-heading); text-align:center; color:var(--brand);}
  .select-screen .sub{font-size:var(--fs-small); font-weight:300; color:var(--gris-oscuro); text-align:center; margin:var(--gap-micro) 0 var(--gap-heading);}
  .filtro-input{
    width:100%; border:1px solid var(--line-soft); background:var(--paper);
    border-radius:var(--radius); padding:var(--pad-control) 12px; font-size:var(--fs-body); font-weight:400;
    font-family:var(--sans); color:var(--carbon-gastado); box-shadow:var(--carve); margin-bottom:var(--gap-block);
  }
  .filtro-input::placeholder{color:var(--muted-2); font-weight:300;}
  .filtro-input:focus{outline:1px solid var(--gris-oscuro); outline-offset:1px;}
  .curso-list{list-style:none; margin:0; padding:0; overflow-y:auto; flex:1; border-top:1px solid var(--line-soft);}
  .curso-item{
    width:100%; text-align:left; border:none; border-bottom:1px solid var(--line-soft); background:none;
    padding:var(--gap-block) 2px; font-family:var(--sans); color:var(--carbon-gastado);
  }
  .curso-list li:last-child .curso-item{border-bottom:none;}
  .curso-item .cnombre{display:block; font-size:var(--fs-body); font-weight:400; color:var(--gris-oscuro);}
  .curso-item .cmeta{display:block; font-size:var(--fs-small); font-weight:300; color:var(--gris-oscuro); margin-top:var(--gap-micro);}

  /* brillo en movimiento sobre texto: una copia del texto (attr(data-text))
     se superpone recortada al glifo, con un degradé claro que barre de
     izquierda a derecha una sola vez. mix-blend-mode aclara el texto de
     base sin taparlo. */
  .shine-host{position:relative; display:inline-block;}
  .shine-host::after{
    content: attr(data-text);
    position:absolute; left:0; top:0; white-space:nowrap;
    background-image: linear-gradient(100deg, transparent 35%, rgba(255,255,255,.95) 50%, transparent 65%);
    background-size: 250% 100%;
    background-repeat: no-repeat;
    background-position: 120% 0;
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
    mix-blend-mode: screen; pointer-events:none; opacity:0;
  }
  .shine-host.shine-play::after{
    opacity:1;
    animation: shine-sweep .7s var(--ease-premium) forwards;
  }
  @keyframes shine-sweep{
    from{ background-position: 120% 0; }
    to{ background-position: -120% 0; }
  }
  .curso-empty{font-size:var(--fs-small); font-weight:300; color:var(--gris-oscuro); text-align:center; padding:24px 4px; line-height:1.6;}
  .plain-msg{display:flex; align-items:center; justify-content:center; padding:20px; text-align:center; font-size:var(--fs-body); font-weight:300; color:var(--gris-oscuro); line-height:1.6; flex:1;}
  .bulk-actions{display:flex; gap:16px; justify-content:center; margin-bottom:var(--gap-block);}
  .header-meta{font-size:var(--fs-small); font-weight:300; color:var(--gris-oscuro); text-align:center; margin:var(--gap-micro) 0 var(--gap-heading);}
  .banner-info{font-size:var(--fs-small); font-weight:300; color:var(--gris-oscuro); line-height:1.6; width:100%; margin:0 0 var(--gap-block); text-align:center;}
  .banner-pending{font-size:var(--fs-small); font-weight:400; color:var(--brand-ink); line-height:1.6; width:100%; margin:0 0 var(--gap-block); text-align:left;}
  .status{font-size:var(--fs-small); font-weight:300; color:var(--gris-oscuro); text-align:center; margin-top:var(--gap-heading); line-height:1.5;}

  .att-header{padding:40px var(--gutter) 0; display:flex; flex-direction:column;}
  .header-divider{width:100%; height:1px; background:var(--line-soft); margin:var(--gap-heading) 0 0;}
  .att-header h1{font-size:var(--fs-display); font-weight:600; letter-spacing:.02em; margin:0 0 var(--gap-heading); text-align:center; color:var(--brand);}
  .date-row{
    position:relative;
    border:1px solid var(--precision-line);
    background:linear-gradient(180deg, #F1F1EE 0%, var(--paper) 55%);
    border-radius:var(--radius); padding:var(--pad-control) 16px; font-size:var(--fs-small); font-weight:400;
    display:flex; align-items:center; justify-content:center; gap:8px; color:var(--ink-max);
    width:100%; margin:0 0 var(--gap-block);
    box-shadow: var(--carve);
  }
  .date-row-text span:last-child{color:var(--gris-oscuro); line-height:1;}
  .att-body{flex:1; overflow:hidden; padding:var(--gap-block) var(--gutter) var(--gap-close);}

  .stat-strip{
    display:flex; border:1px solid var(--precision-line);
    background:linear-gradient(180deg, #F5F5F2 0%, var(--paper) 60%);
    border-radius:var(--radius); margin:0 0 var(--gap-block); width:100%; padding:var(--gap-field) 4px;
    box-shadow: inset 0 1px 2px rgba(42,40,38,.07), inset 0 -1px 0 rgba(255,255,255,.5);
  }
  .stat{flex:1; text-align:center; padding:0 3px; border-right:1px solid var(--precision-line);}
  .stat:last-child{border-right:none;}
  .stat .n{
    position:relative; width:54px; height:54px; margin:0 auto var(--gap-micro); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--gris-oscuro); color:var(--carbon-gastado);
    font-size:var(--fs-body); font-weight:500; font-variant-numeric:tabular-nums;
    background:linear-gradient(155deg, #E3E3DF 0%, #ECECE8 50%, #F5F5F2 100%);
    box-shadow: inset 1px 1px 2px rgba(42,40,38,.10), inset -0.5px -0.5px 1px rgba(255,255,255,.5);
  }
  .stat .n.n-presente{color:rgb(18,125,105);}
  .stat .l{font-size:var(--fs-micro-mono); font-weight:500; color:var(--gris-oscuro); text-transform:uppercase; letter-spacing:.05em; margin-top:0;}

  .roster{border-top:1px solid var(--line-soft);}
  .student{display:flex; align-items:center; gap:12px; padding:var(--gap-block) 2px; border-bottom:1px solid var(--line-soft);}
  .student:last-child{border-bottom:none;}
  .sname{flex:1; font-family:var(--sans); font-size:var(--fs-body); font-weight:400; color:var(--gris-oscuro); text-align:left;}
  .switch{
    position:relative; width:112px; height:36px; background:var(--paper);
    flex-shrink:0; overflow:hidden; cursor:pointer; -webkit-tap-highlight-color:transparent;
    outline:1px solid var(--muted-2); outline-offset:0;
  }
  .switch:focus-visible{outline:2px solid var(--presente); outline-offset:1px;}
  .switch-cell{
    position:absolute; top:0; width:34px; height:36px; z-index:2;
    display:flex; align-items:center; justify-content:center;
    transition:left .2s var(--ease-premium), background .15s ease, border-color .15s ease;
  }
  .switch.is-p .switch-cell{left:78px;}
  .switch.is-a .switch-cell{left:0;}
  .switch.is-p .switch-cell{
    box-shadow: inset 0 0 0 1px var(--precision-line);
    background:
      radial-gradient(120% 140% at 28% 22%, rgba(255,255,255,.9) 0%, rgba(255,255,255,0) 45%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n2'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n2)' opacity='0.025'/></svg>"),
      linear-gradient(160deg, #FDFDFC 0%, #F9F8F5 100%);
  }
  .switch.is-a .switch-cell{
    box-shadow: inset 0 0 0 1px rgba(42,40,38,.14);
    background:
      radial-gradient(120% 140% at 28% 22%, rgba(255,255,255,.9) 0%, rgba(255,255,255,0) 45%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/></svg>"),
      linear-gradient(160deg, #FBFAF6 0%, #F0EEE7 100%);
  }
  .switch-cell::before{
    content:''; position:absolute; left:50%; top:50%; width:17.8px; height:17.8px;
    border-radius:50%; transform:translate(-50%,-50%); z-index:-1;
    background:rgba(18,125,105,0); filter:blur(4px); transition:background .125s ease; pointer-events:none;
  }
  .switch-cell.lit::before{background:rgba(18,125,105,.45);}
  .switch-check{width:18px; height:18px; overflow:visible;}
  .switch-check .check-fg{transition:fill .15s ease;}
  .switch.is-p .switch-check .check-fg{fill:#fff;}
  .switch.is-a .switch-check .check-fg{fill:var(--muted-3);}
  .switch-check .check-glow{fill:none; stroke:rgb(18,125,105); stroke-linejoin:round;
    opacity:0; transition:opacity .15s ease;}
  .switch-check .check-glow-1{stroke-width:1.6; filter:url(#tilde-contour-blur-1);}
  .switch-check .check-glow-1.lit{opacity:.85;}
  .switch-check .check-glow-2{stroke-width:2.8; filter:url(#tilde-contour-blur-2);}
  .switch-check .check-glow-2.lit{opacity:.5;}
  .switch-check .check-glow-3{stroke-width:4.4; filter:url(#tilde-contour-blur-3);}
  .switch-check .check-glow-3.lit{opacity:.28;}
  .switch-groove{
    position:absolute; top:0; left:0; width:112px; height:36px; z-index:1;
    background:linear-gradient(180deg, #F1F1EE 0%, var(--paper) 60%);
    box-shadow: inset 0 1px 1.5px rgba(42,40,38,.08), inset 0 -1px 0 rgba(255,255,255,.45);
  }
  .switch-caption{
    position:absolute; top:50%; width:46px; transform:translate(-50%,-50%);
    font-family:var(--mono); font-size:var(--fs-micro-mono); font-weight:500; letter-spacing:0;
    text-transform:uppercase; color:var(--muted); text-align:center;
    white-space:nowrap; overflow:hidden; line-height:1;
    text-shadow:0 1px 0 rgba(255,255,255,.6); pointer-events:none;
  }

  .gbtn:active,
  .save-btn:active, .add-btn:active, .alta-confirm:active{
    box-shadow: inset 2px 2px 3px rgba(42,40,38,.12), inset -1px -1px 0 rgba(70,65,58,.6);
  }
  .save-bar{padding:var(--gap-block) 0 var(--gap-close); margin-top:auto; border-top:1px solid var(--line-soft);}
  .save-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; background:var(--paper); color:var(--carbon-gastado); border:1px solid var(--muted-2); border-radius:var(--radius);
    padding:10px 20px; font-size:var(--fs-body); font-weight:400; letter-spacing:.02em; font-family:inherit; transition:box-shadow .08s var(--ease-premium);
  }
  .save-btn .save-dot{width:8px; height:8px; border-radius:50%; border:1px solid var(--brand); background:transparent; flex-shrink:0;}
  .save-btn .save-btn-label{line-height:1;}
  .save-btn.is-saving, .save-btn.is-saved{pointer-events:none;}
  .save-btn.is-saving .save-dot{border-color: rgba(217,105,43,.22); border-top-color: var(--brand); box-shadow:none; animation: save-spin 1s linear infinite;}
  .save-btn.is-saved .save-dot{border-color: var(--brand); background: transparent; box-shadow: var(--carve); animation: dot-sink .5s var(--ease-premium) forwards;}
  @keyframes save-spin{ to{ transform:rotate(360deg); } }
  @keyframes dot-sink{ 0%{ transform:scale(1); } 45%{ transform:scale(.68); } 100%{ transform:scale(1); } }
  .add-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; background:var(--paper); color:var(--carbon-gastado); border:1px solid var(--muted-2); border-radius:var(--radius);
    padding:10px 20px; font-size:var(--fs-body); font-weight:400; letter-spacing:.02em; font-family:inherit; transition:box-shadow .08s var(--ease-premium);
    margin-top:var(--gap-heading);
  }
  .add-btn .save-dot{width:8px; height:8px; border-radius:50%; border:1px solid var(--brand); background:transparent; flex-shrink:0;}

  .alta-panel{padding:0 2px 4px;}
  .alta-panel .alta-title{font-size:var(--fs-body); font-weight:500; color:var(--carbon-gastado); margin-bottom:var(--gap-block);}
  .alta-panel .alta-sub{font-size:var(--fs-small); font-weight:300; color:var(--gris-oscuro); line-height:1.5; margin-bottom:var(--gap-block);}
  .alta-field{margin-bottom:var(--gap-field);}
  .alta-field label{display:block; font-size:var(--fs-micro); font-weight:500; letter-spacing:.06em; text-transform:uppercase; color:var(--gris-oscuro); margin-bottom:var(--gap-micro); font-family:var(--mono);}
  .alta-field input{
    width:100%; border:1px solid var(--precision-line); background:var(--paper);
    border-radius:var(--radius); padding:var(--pad-control) 12px; font-size:var(--fs-body); font-weight:400;
    font-family:var(--sans); color:var(--carbon-gastado); box-shadow: var(--carve);
  }
  .alta-field input::placeholder{color:var(--muted-2); font-weight:300;}
  .alta-error{font-size:var(--fs-small); font-weight:400; color:var(--brand-ink); margin:-4px 0 var(--gap-field);}
  .alta-actions{display:flex; align-items:center; justify-content:space-between; gap:var(--gap-block); margin-top:var(--gap-block);}
  .alta-confirm{
    flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--paper); color:var(--carbon-gastado); border:1px solid var(--muted-2); border-radius:var(--radius);
    padding:10px 20px; font-size:var(--fs-body); font-weight:400; letter-spacing:.02em; font-family:inherit;
  }
  .alta-confirm:disabled{opacity:.6;}
  .alta-confirm .save-dot{width:8px; height:8px; border-radius:50%; border:1px solid var(--brand); background:transparent; flex-shrink:0;}
  .alta-cancel{
    background:none; border:none; color:var(--gris-oscuro); font-size:var(--fs-small); font-weight:400;
    font-family:inherit; padding:6px 4px; cursor:pointer;
  }

  /* hundimiento sutil para botones de solo texto (sin caja/borde visible en
     reposo): el box-shadow inset compartido con los botones con fondo no
     se lee bien acá, así que en vez de una sombra se hunde el propio texto
     — se achica un poco y baja 1px, con un fade leve, y vuelve con el mismo
     ease "premium" que usa el resto de la app. */
  .alta-cancel, .curso-item, .date-row-text{
    transition: transform .12s var(--ease-premium), opacity .12s var(--ease-premium);
  }
  .alta-cancel:active, .curso-item:active{
    transform: translateY(1px) scale(.96);
    opacity:.6;
  }
  .date-row-text{display:flex; align-items:center; gap:8px;}
  .date-row:active .date-row-text{
    transform: translateY(1px) scale(.96);
    opacity:.6;
  }
</style>
</head>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="tilde-contour-blur-1" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.9"/>
    </filter>
    <filter id="tilde-contour-blur-2" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.1"/>
    </filter>
    <filter id="tilde-contour-blur-3" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4.2"/>
    </filter>
  </defs>
</svg>

<div class="app" id="app">
  <div class="plain-msg">Cargando…</div>
</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxtg9d0gkoTkVQ_lciJk7SugqMXaoqAM93XmN3U6ghpxOjfhrwoGP8J7Yw5mP-5uNMd/exec";

const GOOGLE_CLIENT_ID = "602289685493-vqk48ip48087vjpc2fmm1odkdrnqkja8.apps.googleusercontent.com";

const PRESENTE = 'Presente';
const AUSENTE = 'Ausente';
const QUEUE_KEY = 'pendingSaves';

const DEMO = new URLSearchParams(location.search).get('demo') === '1';

let screen = 'login';
let errorMsg = '';

let idToken = '';
let docenteNombre = '';
let cursoId = localStorage.getItem('cursoId') || '';
let cursoNombre = localStorage.getItem('cursoNombre') || '';
let cursoMeta = localStorage.getItem('cursoMeta') || '';

let cursos = [];
let cursoFiltro = '';

let students = [];
let attendance = {};
let attendanceSaved = {};
let cargadoInfo = { cargado: false, ultimaCarga: null, cargadoPor: '' };

let altaForm = { dni: '', nombre: '', telefono: '', error: '' };
let altaSaving = false;

let saveState = 'idle';
let statusMsg = '';

let bulkAllTarget = PRESENTE;

function todayLocal(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
let currentDate = todayLocal();

function formatDate(iso){
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('es-AR', { weekday:'short', day:'2-digit', month:'short' });
}
function formatDateRow(iso){
  const d = new Date(iso + 'T00:00:00');
  let s = d.toLocaleDateString('es-AR', { weekday:'long', day:'numeric', month:'long' }).replace(',', '');
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function isDirty(){
  const keys = Object.keys(attendance);
  if (keys.length !== Object.keys(attendanceSaved).length) return true;
  return keys.some(k => attendance[k] !== attendanceSaved[k]);
}

async function apiGet(params){
  const url = `${APPS_SCRIPT_URL}?${params}&idToken=${encodeURIComponent(idToken)}`;
  const res = await fetch(url);
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'Error desconocido.');
  return data;
}

function getQueue(){
  try{ return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); }
  catch(e){ return []; }
}
function setQueue(q){ localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }
function queueSave(payloadConToken){
  const { idToken: _drop, ...sinToken } = payloadConToken;
  const q = getQueue().filter(p => !(p.cursoId === sinToken.cursoId && p.fecha === sinToken.fecha));
  q.push(sinToken);
  setQueue(q);
}
async function flushQueue(){
  const q = getQueue();
  if (!q.length) return;
  if (!idToken){ render(); return; }

  const vistaEnCola = screen === 'attendance' &&
    q.some(p => p.cursoId === cursoId && p.fecha === currentDate);
  if (vistaEnCola){
    saveState = 'saving';
    render();
  }

  const restantes = [];
  const exitosos = [];
  for (const payloadSinToken of q){
    const payload = Object.assign({}, payloadSinToken, { idToken });
    try{
      const res = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
      const result = await res.json();
      if (!result.ok){
        if (/sesi[oó]n|token/i.test(result.error || '')){
          idToken = '';
          restantes.push(payloadSinToken);
          continue;
        }
        throw new Error(result.error || 'error');
      }
      exitosos.push(payloadSinToken);
    }catch(e){
      restantes.push(payloadSinToken);
    }
  }
  setQueue(restantes);

  const afectaVistaActual = screen === 'attendance' &&
    exitosos.some(p => p.cursoId === cursoId && p.fecha === currentDate);

  if (afectaVistaActual){
    await loadForDate(currentDate);
    saveState = 'saved';
    statusMsg = 'Subido apenas volvió la señal.';
    render();
    setTimeout(() => { saveState = 'idle'; statusMsg = ''; render(); }, 4000);
  } else {
    if (vistaEnCola) saveState = 'idle';
    render();
  }
}

function esperarGoogleIdentity(intentos){
  return new Promise((resolve, reject) => {
    const check = (restantes) => {
      if (window.google && google.accounts && google.accounts.id) return resolve();
      if (restantes <= 0) return reject(new Error('No se pudo cargar el login de Google.'));
      setTimeout(() => check(restantes - 1), 150);
    };
    check(intentos);
  });
}

async function init(){
  if ('serviceWorker' in navigator){
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  }
  window.addEventListener('online', flushQueue);
  setInterval(flushQueue, 30000);

  if (DEMO){
    docenteNombre = 'Demo';
    cursos = [

    errorMsg = 'No se pudo cargar el botón de Google. Revisá tu conexión y recargá la página.';

function aplicarAsistenciaCargada(data){
  cargadoInfo = { cargado: data.cargado, ultimaCarga: data.ultimaCarga, cargadoPor: data.cargadoPor };
  attendance = {};
  students.forEach(s => {
    attendance[s.dni] = (s.dni in data.asistencia) ? data.asistencia[s.dni] : AUSENTE;
  });
  attendanceSaved = Object.assign({}, attendance);
  bulkAllTarget = PRESENTE;
}

async function loadForDate(date){
  try{
    const data = await apiGet(`action=attendance&cursoId=${encodeURIComponent(cursoId)}&fecha=${date}`);
    aplicarAsistenciaCargada(data);
  }catch(e){
    cargadoInfo = { cargado: false, ultimaCarga: null, cargadoPor: '' };
    attendance = {};
    students.forEach(s => attendance[s.dni] = PRESENTE);
    attendanceSaved = Object.assign({}, attendance);
  }
  render();
}

function cambiarFecha(nuevaFecha, inputEl){
  if (isDirty()){
    const seguro = confirm('Tenés cambios sin guardar en esta fecha. Si cambiás de fecha ahora, se pierden.\n¿Querés continuar sin guardar?');
    if (!seguro){
      if (inputEl) inputEl.value = currentDate;
      return;
    }
  }
  currentDate = nuevaFecha;
  saveState = 'idle'; statusMsg = '';
  loadForDate(currentDate);
}

async function save(){
  if (saveState === 'saving') return;

  if (cargadoInfo.cargado){
    const aviso = `Esta fecha ya tiene una carga (${cargadoInfo.ultimaCarga}${cargadoInfo.cargadoPor ? ' — ' + cargadoInfo.cargadoPor : ''}).\n¿Confirmás que querés modificarla?`;
    if (!confirm(aviso)) return;
  }

  const payload = { cursoId, fecha: currentDate, asistencia: attendance, idToken };
  saveState = 'saving'; statusMsg = '';
  render();

  let res;
  try{
    res = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
  }catch(e){
    saveState = 'idle';
    queueSave(payload);
    attendanceSaved = Object.assign({}, attendance);
    statusMsg = 'Sin conexión — quedó guardado en este celular y se sube solo apenas vuelva la señal.';
    render();
    return;
  }

  let result;
  try{
    result = await res.json();
  }catch(e){
    saveState = 'idle';
    queueSave(payload);
    attendanceSaved = Object.assign({}, attendance);
    statusMsg = 'Sin conexión — quedó guardado en este celular y se sube solo apenas vuelva la señal.';
    render();
    return;
  }

  if (!result.ok){
    saveState = 'idle';
    statusMsg = result.error || 'No se pudo guardar. Revisá e intentá de nuevo.';
    render();
    return;
  }

  saveState = 'saved';
  render();
  await loadForDate(currentDate);
  statusMsg = result.ignorados > 0
    ? `${result.ignorados} registro(s) ignorado(s) por no pertenecer a este curso`
    : '';
  render();
  setTimeout(() => { saveState = 'idle'; render(); }, 2200);
}

function demoSimulateSave(kind){
  if (kind === 'offline'){
    saveState = 'idle';
    attendanceSaved = Object.assign({}, attendance);
    statusMsg = 'Sin conexión — quedó guardado en este celular y se sube solo apenas vuelva la señal.';
  } else if (kind === 'rejected'){
    saveState = 'idle';
    statusMsg = 'No se pudo guardar. Revisá e intentá de nuevo.';
  } else if (kind === 'ok'){
    saveState = 'saved';
    statusMsg = '';
    attendanceSaved = Object.assign({}, attendance);
    setTimeout(() => { saveState = 'idle'; render(); }, 2200);
  }
  render();
}

async function confirmarAlta(){
  const dni = (altaForm.dni || '').replace(/\D/g, '');
  const nombre = (altaForm.nombre || '').trim();
  const telefono = (altaForm.telefono || '').trim();

  if (!dni || dni.length < 6){ altaForm.error = 'DNI inválido.'; render(); return; }
  if (!nombre){ altaForm.error = 'Falta el nombre.'; render(); return; }
  if (students.some(s => s.dni === dni)){
    altaForm.error = 'Ya hay un alumno con ese DNI en este curso.';
    render();
    return;
  }

  altaForm.error = '';
  altaSaving = true;
  render();

  if (DEMO){
    setTimeout(() => {
      students.push({ dni, name: nombre });
      students.sort((a, b) => a.name.localeCompare(b.name, 'es'));
      attendance[dni] = AUSENTE;
      altaSaving = false;
      screen = 'attendance';
      render();
    }, 400);
    return;
  }

  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'altaAlumno', cursoId, dni, nombre, telefono, idToken })
    });
    const result = await res.json();
    if (!result.ok) throw new Error(result.error || 'No se pudo agregar.');

    students.push({ dni, name: nombre });
    students.sort((a, b) => a.name.localeCompare(b.name, 'es'));
    attendance[dni] = AUSENTE;
    altaSaving = false;
    screen = 'attendance';
    render();
  }catch(e){
    altaSaving = false;
    altaForm.error = e.message || 'No se pudo agregar. Revisá tu conexión.';
    render();
  }
}

function pendingBannerHTML(){

  if (!idToken){

  }
  return `<div class="banner-pending">${sujeto} sin subir todavía — se reintenta solo cuando haya señal.</div>`;

function wireSwitches(){
  document.querySelectorAll('.switch').forEach(function(sw){
    const dni = sw.dataset.dni;
    sw.setAttribute('role', 'switch');
    sw.setAttribute('tabindex', '0');
    const isP = sw.classList.contains('is-p');
    sw.setAttribute('aria-checked', isP ? 'true' : 'false');
    const checks = sw.querySelectorAll('.check-glow');
    const cell = sw.querySelector('.switch-cell');
    const caption = sw.querySelector('.switch-caption');
    let captionTimer = null;

    if (caption) caption.style.left = isP ? '37px' : '73px';
    if (isP){ checks.forEach(c => c.classList.add('lit')); cell.classList.add('lit'); }

    cell.addEventListener('transitionend', function(e){
      if (e.propertyName !== 'left') return;
      const nowLit = sw.classList.contains('is-p');
      checks.forEach(c => c.classList.toggle('lit', nowLit));
      cell.classList.toggle('lit', nowLit);
    });

    function doToggle(){
      const nowP = sw.classList.toggle('is-p');
      sw.classList.toggle('is-a', !nowP);
      sw.setAttribute('aria-checked', nowP ? 'true' : 'false');
      checks.forEach(c => c.classList.remove('lit'));
      cell.classList.remove('lit');

      attendance[dni] = nowP ? PRESENTE : AUSENTE;
      updateStatCounts();

      if (caption){
        if (captionTimer) clearTimeout(captionTimer);
        captionTimer = setTimeout(function(){
          caption.style.left = nowP ? '37px' : '73px';
          caption.textContent = nowP ? 'presente' : 'ausente';
          captionTimer = null;
        }, 100);
      }
    }
    sw.addEventListener('click', doToggle);
    sw.addEventListener('keydown', function(e){
      if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); doToggle(); }
    });
  });
}

function updateStatCounts(){

                <button class="alta-cancel" id="demoOffline">Sin señal</button>
                <button class="alta-cancel" id="demoRejected">Rechazo del servidor</button>
                <button class="alta-cancel" id="demoOk">Guardado ok</button>
              </div>
            </div>
          ` : ''}
        </div>
      `}
      <button class="alta-cancel" id="cambiarCursoBtn" style="display:block; margin:var(--gap-close) auto 0;">Cambiar de curso</button>
    </div>
  `;

  document.getElementById('cambiarCursoBtn').addEventListener('click', changeCourse);
  document.getElementById('abrirAltaBtn')?.addEventListener('click', abrirAlta);

  if (!sinAlumnos){
    document.getElementById('datePicker').addEventListener('change', e => {
      cambiarFecha(e.target.value, e.target);
    });
    document.getElementById('allPresent').addEventListener('click', () => {
      const valor = bulkAllTarget;
      bulkAllTarget = (valor === PRESENTE) ? AUSENTE : PRESENTE;
      setAll(valor);
    });
    document.getElementById('saveBtn').addEventListener('click', save);
    wireSwitches();
    if (DEMO){
      document.getElementById('demoOffline').addEventListener('click', () => demoSimulateSave('offline'));
      document.getElementById('demoRejected').addEventListener('click', () => demoSimulateSave('rejected'));
      document.getElementById('demoOk').addEventListener('click', () => demoSimulateSave('ok'));
    }
  }
}

init();
</script>
</body>
</html>
