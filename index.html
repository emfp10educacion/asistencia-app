<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Asistencia</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#FCFCFB">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@200;300;400;500&display=swap" rel="stylesheet">

<!--
  v8 — migración de sistema visual completa. Reemplaza el sistema
  anterior (teal/rojo, radius:14px) por el sistema de
  muestra_identidad_asistencia_version_final.html (V104), sobre el
  motor funcional real de v6 (OAuth, cola offline, alta de alumno,
  PWA) — la muestra nunca tuvo lógica real, era demo estática.

  Decisiones tomadas en esta sesión, todas aplicadas acá:
  1. Sin avatar de iniciales — la muestra tampoco lo tenía.
  2. "Agregar alumno" pasa de toggle inline a pantalla propia
     (screen='alta'), como lo mostraba la muestra en un frame aparte.
  3. Guardar asistencia — dos categorías de error: sin señal/timeout
     se encola igual que siempre (cola offline real, no simulada);
     error del servidor o sesión vencida a mitad de guardado NO se
     encola — aviso explícito, botón vuelve a estado inicial para
     reintentar a mano.
  4. Ícono de la app — diferido, no es parte de esta migración.
  5. Banner "N asistencia(s) sin subir" — sin número si es una sola
     (getQueue().length representa listas completas por curso+fecha,
     no alumnos individuales — confirmado contra queueSave(), que
     dedupea por cursoId+fecha). Color var(--brand-ink), sin ícono ni
     marcador, mismo tratamiento que .alta-error (precedente real en
     la muestra, no inventado).

  Pantallas que la muestra nunca diseñó (select-course, login-error,
  loading, error, los banners new/existing) se resolvieron acá con el
  mismo lenguaje visual — carve, --radius:0, misma escala tipográfica
  — documentado en el bloque de estilos "NUEVO — sin cobertura en la
  muestra" más abajo.

  Pendiente #5 del handoff (.add-btn .save-dot sin actualizar) se
  resuelve acá: el punto pasa de --ink-max a --brand, igualando el
  criterio ya fijado en V101-V103 para .save-btn/.gbtn/.alta-confirm
  ("recuadro siempre neutro, punto siempre naranja").

  Pendiente de esta migración, sin resolver a propósito: el ícono de
  la app (círculo naranja + tilde blanca, diferido por el líder) y el
  theme-color real dentro de manifest.json (archivo no provisto en
  esta sesión — el <meta theme-color> de este HTML ya está en
  #FCFCFB, pero el manifest puede tener su propio valor sin tocar).
-->

<style>
  :root{
    --ink:#2A2826;
    --paper:#FCFCFB;
    --muted:#8F8F8B;
    --muted-2:#BDBDB8;
    --muted-3:#D6D6D2;
    --brand:#D9692B;
    --brand-ink:#B8571F;
    --presente:#10677F;
    --carbon-gastado:#46413A;
    --gris-oscuro:#6B665D;
    --ink-max:#0A0806;
    --line-soft:rgba(42,40,38,.10);
    --precision-line:rgba(42,40,38,.16);
    --precision-ink:#333A40;
    --radius:0px;
    --carve: inset 0 2px 3px rgba(42,40,38,.12), inset 0 -1px 0 rgba(255,255,255,.55);
    --ease-premium: cubic-bezier(.65,0,.35,1);
    --sans:ui-rounded,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --mono:ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',monospace;
    /* escala tipográfica — seis pasos con rol fijo, no valores sueltos por bloque */
    --fs-micro-mono:8.5px;  /* rótulos decorativos: presente/ausente del switch, Presentes/Ausentes/Matrícula */
    --fs-micro:10px;        /* etiquetas de campo: DNI, NOMBRE, TELÉFONO; pie de login */
    --fs-small:12px;        /* texto secundario: avisos, banners, meta, subtítulos */
    --fs-body:14px;         /* texto principal: nombres, botones, inputs */
    --fs-stat:15px;         /* números del tablero de stats */
    --fs-heading:16px;      /* h2 de pantalla */
    --fs-display:25px;      /* nombre del curso */
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:var(--sans); font-weight:300;
    background:var(--paper); color:var(--carbon-gastado); -webkit-tap-highlight-color:transparent;
  }
  .app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--paper);}

  /* ============ login / login-error ============ */
  .login-screen{flex:1; display:flex; flex-direction:column; align-items:center; padding:44px 20px 40px;}
  .login-logo{width:232px; height:auto; margin-bottom:28px;}
  .login-screen h2{font-size:var(--fs-heading); font-weight:300; margin:0 0 10px; text-align:center; position:relative; display:inline-block; padding-bottom:8px;}
  .login-screen h2::after{content:''; position:absolute; left:20%; right:20%; bottom:0; height:1px; background:var(--line-soft);}
  .login-screen p{font-size:var(--fs-small); font-weight:300; color:var(--gris-oscuro); text-align:center; line-height:1.6; margin:14px 0 32px; max-width:210px;}
  .gbtn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; background:var(--paper); color:var(--carbon-gastado); border:1px solid var(--muted-2); border-radius:var(--radius);
    padding:8px 20px; font-size:var(--fs-body); font-weight:500; letter-spacing:.02em; font-family:inherit;
    transition:box-shadow .08s var(--ease-premium);
  }
  .gbtn .g-dot{width:8px; height:8px; border-radius:50%; border:1px solid var(--brand); background:transparent; flex-shrink:0;}
  .gbtn .gbtn-label{line-height:1;}
  .login-foot{margin-top:auto; font-size:var(--fs-micro); font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--muted-2);}

  /* ============ NUEVO — sin cobertura en la muestra ============ */
  /* select-course: mismo lenguaje que login-screen + cajas talladas
     de .alta-field para el buscador y cada curso. */
  .select-screen{flex:1; display:flex; flex-direction:column; padding:44px 20px 20px;}
  .select-screen h2{font-size:var(--fs-heading); font-weight:300; margin:0 0 8px; text-align:center;}
  .select-screen .sub{font-size:var(--fs-small); font-weight:300; color:var(--gris-oscuro); text-align:center; margin:0 0 20px;}
  .filtro-input{
    width:100%; border:1px solid var(--precision-line); background:var(--paper);
    border-radius:var(--radius); padding:9px 10px; font-size:var(--fs-body); font-weight:400;
    font-family:var(--sans); color:var(--carbon-gastado); box-shadow:var(--carve); margin-bottom:14px;
  }
  .filtro-input::placeholder{color:var(--muted-2); font-weight:300;}
  .curso-list{list-style:none; margin:0; padding:0; overflow-y:auto; flex:1;}
  .curso-item{
    width:100%; text-align:left; border:1px solid var(--precision-line); background:var(--paper);
    border-radius:var(--radius); padding:11px 13px; margin-bottom:8px; box-shadow:var(--carve);
    font-family:var(--sans); color:var(--carbon-gastado);
  }
  .curso-item .cnombre{display:block; font-size:var(--fs-body); font-weight:500;}
  .curso-item .cmeta{display:block; font-size:var(--fs-small); font-weight:300; color:var(--gris-oscuro); margin-top:2px;}
  .curso-empty{font-size:var(--fs-small); font-weight:300; color:var(--gris-oscuro); text-align:center; padding:24px 4px; line-height:1.6;}
  /* loading / error: sin chrome, solo texto centrado */
  .plain-msg{display:flex; align-items:center; justify-content:center; padding:20px; text-align:center; font-size:var(--fs-body); font-weight:300; color:var(--gris-oscuro); line-height:1.6; flex:1;}
  /* link de baja jerarquía, reutilizado para "no soy yo", "Cambiar de
     curso" y "Marcar todos" — mismo componente que .alta-cancel, sin
     inventar un cuarto estilo de botón. */
  .bulk-actions{display:flex; gap:16px; justify-content:center; margin-bottom:12px;}
  .header-meta{font-size:var(--fs-small); font-weight:300; color:var(--gris-oscuro); text-align:center; margin:2px 0 0;}
  .banner-info{font-size:var(--fs-small); font-weight:300; color:var(--gris-oscuro); line-height:1.6; width:76%; margin:0 auto 14px; text-align:left;}
  .banner-pending{font-size:var(--fs-small); font-weight:400; color:var(--brand-ink); line-height:1.6; width:76%; margin:0 auto 14px; text-align:left;}
  .status{font-size:var(--fs-small); font-weight:300; color:var(--gris-oscuro); text-align:center; margin-top:6px; line-height:1.5;}

  /* ============ header de asistencia ============ */
  .att-header{padding:44px 20px 1px; display:flex; flex-direction:column;}
  .header-divider{width:calc(100% + 40px); height:1px; background:var(--line-soft); margin:7px 0 0 -20px;}
  .att-header h1{font-size:var(--fs-display); font-weight:600; letter-spacing:.02em; margin:0 0 6px; text-align:center; color:var(--brand);}
  .date-row{
    position:relative;
    border:1px solid var(--precision-line);
    background:linear-gradient(180deg, #F1F1EE 0%, var(--paper) 55%);
    border-radius:var(--radius); padding:8px 14px; font-size:var(--fs-small); font-weight:400;
    display:flex; align-items:center; justify-content:center; gap:8px; color:var(--ink-max);
    width:90%; margin:0 auto 18px;
    box-shadow: var(--carve);
  }
  .date-row span:last-child{color:var(--gris-oscuro); line-height:1;}
  .att-body{flex:1; overflow:hidden; padding:2px 20px 0;}

  /* ============ tablero de stats ============ */
  .stat-strip{
    display:flex; border:1px solid var(--precision-line);
    background:linear-gradient(180deg, #F5F5F2 0%, var(--paper) 60%);
    border-radius:var(--radius); margin:0 auto 16px; width:76%; padding:8px 2px 6px;
    box-shadow: inset 0 1px 2px rgba(42,40,38,.07), inset 0 -1px 0 rgba(255,255,255,.5);
  }
  .stat{flex:1; text-align:center; padding:0 3px; border-right:1px solid var(--precision-line);}
  .stat:last-child{border-right:none;}
  .stat .n{
    position:relative; width:50px; height:50px; margin:0 auto 3px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--gris-oscuro); color:var(--carbon-gastado);
    font-size:var(--fs-stat); font-weight:500; font-variant-numeric:tabular-nums;
    background:linear-gradient(155deg, #E3E3DF 0%, #ECECE8 50%, #F5F5F2 100%);
    box-shadow: inset 1px 1px 2px rgba(42,40,38,.10), inset -0.5px -0.5px 1px rgba(255,255,255,.5);
  }
  .stat .n.n-presente{color:rgb(18,125,105);}
  .stat .l{font-size:var(--fs-micro-mono); font-weight:500; color:var(--gris-oscuro); text-transform:uppercase; letter-spacing:.05em; margin-top:1px;}

  /* ============ roster + switch ============ */
  .roster{border-top:1px solid var(--line-soft);}
  .student{display:flex; align-items:center; gap:10px; padding:11px 2px; border-bottom:1px solid var(--line-soft);}
  .student:last-child{border-bottom:none;}
  .sname{flex:1; font-family:var(--sans); font-size:var(--fs-body); font-weight:500; color:var(--carbon-gastado); text-align:left;}
  .switch{
    position:relative; width:106px; height:34px; border:1px solid var(--muted-2); background:var(--paper);
    flex-shrink:0; overflow:hidden; cursor:pointer; -webkit-tap-highlight-color:transparent; outline:none;
  }
  .switch:focus{outline:none;}
  .switch:focus-visible{outline:2px solid var(--presente); outline-offset:2px;}
  .switch-cell{
    position:absolute; top:0; width:32px; height:32px; z-index:2;
    display:flex; align-items:center; justify-content:center; background:var(--paper);
    border:1px solid var(--precision-line); transition:left .2s var(--ease-premium);
  }
  .switch.is-p .switch-cell{left:72px;}
  .switch.is-a .switch-cell{left:0;}
  .switch-cell::before{
    content:''; position:absolute; left:50%; top:50%; width:13px; height:13px;
    border-radius:50%; transform:translate(-50%,-50%); z-index:-1;
    background:rgba(18,125,105,0); filter:blur(3px); transition:background .125s ease; pointer-events:none;
  }
  .switch-cell.lit::before{background:rgba(18,125,105,.45);}
  .switch-check{width:15px; height:15px; overflow:visible;}
  .switch-check .check-fg{transition:fill .15s ease;}
  .switch.is-p .switch-check .check-fg{fill:#fff;}
  .switch.is-a .switch-check .check-fg{fill:var(--muted-3);}
  .switch-check .check-glow{fill:rgb(18,125,105); filter:url(#switch-check-glow); opacity:0; transition:opacity .125s ease;}
  .switch-check .check-glow.lit{opacity:1;}
  .switch-groove{
    position:absolute; top:0; left:0; width:104px; height:32px; z-index:1;
    background:linear-gradient(180deg, #F1F1EE 0%, var(--paper) 60%); box-shadow: var(--carve);
  }
  .switch-caption{
    position:absolute; top:50%; width:44px; transform:translate(-50%,-50%);
    font-family:var(--mono); font-size:var(--fs-micro-mono); font-weight:500; letter-spacing:0;
    text-transform:uppercase; color:var(--muted-2); text-align:center;
    white-space:nowrap; overflow:hidden; line-height:1;
    text-shadow:0 1px 0 rgba(255,255,255,.6); pointer-events:none;
  }

  /* ============ save-bar / botones de acción ============ */
  .gbtn:active, .alta-cancel:active,
  .save-btn:active, .add-btn:active, .alta-confirm:active{
    box-shadow: inset 2px 2px 3px rgba(42,40,38,.12), inset -1px -1px 0 rgba(70,65,58,.6);
  }
  .save-bar{padding:15px 0 20px; margin-top:auto; border-top:1px solid var(--line-soft);}
  .save-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; background:var(--paper); color:var(--carbon-gastado); border:1px solid var(--muted-2); border-radius:var(--radius);
    padding:8px 20px; font-size:var(--fs-body); font-weight:500; letter-spacing:.02em; font-family:inherit; transition:box-shadow .08s var(--ease-premium);
  }
  .save-btn .save-dot{width:8px; height:8px; border-radius:50%; border:1px solid var(--brand); background:transparent; flex-shrink:0;}
  .save-btn .save-btn-label{line-height:1;}
  .save-btn.is-saving, .save-btn.is-saved{pointer-events:none;}
  .save-btn.is-saving .save-dot{border-color: rgba(217,105,43,.22); border-top-color: var(--brand); box-shadow:none; animation: save-spin 1s linear infinite;}
  .save-btn.is-saved .save-dot{border-color: var(--brand); background: transparent; animation: save-seal .4s var(--ease-premium) forwards;}
  @keyframes save-spin{ to{ transform:rotate(360deg); } }
  @keyframes save-seal{ 0%{ transform:scale(1); } 45%{ transform:scale(.7); } 100%{ transform:scale(1); } }
  .add-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; background:var(--paper); color:var(--carbon-gastado); border:1px solid var(--muted-2); border-radius:var(--radius);
    padding:8px 20px; font-size:var(--fs-body); font-weight:500; letter-spacing:.02em; font-family:inherit; transition:box-shadow .08s var(--ease-premium);
    margin-top:4px;
  }
  /* pendiente #5 del handoff, resuelto acá: el punto de Agregar alumno
     seguía en --ink-max, el único de los cuatro botones de acción que
     no había recibido el ajuste que V101-V103 aplicó a
     .save-btn/.gbtn/.alta-confirm ("recuadro siempre neutro, punto
     siempre naranja"). Se iguala. */
  .add-btn .save-dot{width:8px; height:8px; border-radius:50%; border:1px solid var(--brand); background:transparent; flex-shrink:0;}

  /* ============ panel de alta (pantalla propia) ============ */
  .alta-panel{padding:14px 2px 4px;}
  .alta-panel .alta-title{font-size:var(--fs-body); font-weight:500; color:var(--carbon-gastado); margin-bottom:3px;}
  .alta-panel .alta-sub{font-size:var(--fs-small); font-weight:300; color:var(--gris-oscuro); line-height:1.5; margin-bottom:14px;}
  .alta-field{margin-bottom:10px;}
  .alta-field label{display:block; font-size:var(--fs-micro); font-weight:500; letter-spacing:.06em; text-transform:uppercase; color:var(--gris-oscuro); margin-bottom:5px; font-family:var(--mono);}
  .alta-field label .alta-opt{color:var(--muted-2); font-weight:400;}
  .alta-field input{
    width:100%; border:1px solid var(--precision-line); background:var(--paper);
    border-radius:var(--radius); padding:9px 10px; font-size:var(--fs-body); font-weight:400;
    font-family:var(--sans); color:var(--carbon-gastado); box-shadow: var(--carve);
  }
  .alta-field input::placeholder{color:var(--muted-2); font-weight:300;}
  .alta-error{font-size:var(--fs-small); font-weight:400; color:var(--brand-ink); margin:-2px 0 10px;}
  .alta-actions{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-top:14px;}
  .alta-confirm{
    flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--paper); color:var(--carbon-gastado); border:1px solid var(--muted-2); border-radius:var(--radius);
    padding:8px 20px; font-size:var(--fs-body); font-weight:500; letter-spacing:.02em; font-family:inherit;
  }
  .alta-confirm:disabled{opacity:.6;}
  .alta-confirm .save-dot{width:8px; height:8px; border-radius:50%; border:1px solid var(--brand); background:transparent; flex-shrink:0;}
  /* Reutilizada como el "link" de baja jerarquía en todo el sistema:
     no soy yo/Inicio, Cambiar de curso, Marcar todos, Cancelar. Sin
     subrayado por pedido explícito — antes tenía text-decoration. */
  .alta-cancel{
    background:none; border:none; color:var(--gris-oscuro); font-size:var(--fs-small); font-weight:400;
    font-family:inherit; padding:6px 4px; cursor:pointer;
  }
</style>
</head>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="switch-check-glow" x="-300%" y="-300%" width="700%" height="700%">
      <feMorphology in="SourceGraphic" operator="dilate" radius="0.11" result="core-shape"/>
      <feGaussianBlur in="core-shape" stdDeviation="0.6" result="core"/>
      <feMorphology in="SourceGraphic" operator="dilate" radius="1.13" result="halo-shape"/>
      <feGaussianBlur in="halo-shape" stdDeviation="1.88" result="halo-raw"/>
      <feComponentTransfer in="halo-raw" result="halo">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="halo"/>
        <feMergeNode in="core"/>
      </feMerge>
    </filter>
  </defs>
</svg>

<div class="app" id="app">
  <div class="plain-msg">Cargando…</div>
</div>

<script>
// 👇 URL que da Apps Script al implementar (termina en /exec)
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxtg9d0gkoTkVQ_lciJk7SugqMXaoqAM93XmN3U6ghpxOjfhrwoGP8J7Yw5mP-5uNMd/exec";

// 👇 Client ID de OAuth generado en Google Cloud Console — tiene que
//    ser EXACTAMENTE el mismo valor que GOOGLE_CLIENT_ID en el backend.
const GOOGLE_CLIENT_ID = "602289685493-vqk48ip48087vjpc2fmm1odkdrnqkja8.apps.googleusercontent.com";

// v8 — migración de sistema visual (ver comentario largo en <head>).
// Cambios funcionales respecto a v6, más allá del CSS/HTML:
//  - "Agregar alumno" pasa a pantalla propia (screen='alta') en vez
//    de toggle inline — altaForm ya no tiene campo "open".
//  - Se agrega el campo Teléfono al alta, conectado a altaAlumno()
//    del backend v8 (antes la hoja tenía la columna, la función la
//    descartaba en silencio).
//  - save() distingue dos categorías de falla: sin señal/timeout se
//    encola igual que siempre (comportamiento de v6, sin cambios);
//    el servidor respondiendo con ok:false (validación, sesión
//    vencida a mitad de guardado) YA NO se encola — antes v6 solo
//    tenía una rama de error y encolaba cualquier falla por igual.
//  - Los switches actualizan `attendance` y el tablero de stats sin
//    disparar un render() completo — necesario para no destruir la
//    animación de deslizamiento en cada toque (ver wireSwitches()).
//  - Se retira initials()/avatar — no forma parte del sistema nuevo.
const PRESENTE = 'Presente';
const AUSENTE = 'Ausente';
const QUEUE_KEY = 'pendingSaves';

// Modo demo — abrir el archivo con "?demo=1" al final de la URL salta el
// login de Google y el backend real, y carga datos de mentira para poder
// revisar visualmente las seis pantallas sin desplegar nada. Sin ese
// parámetro en la URL, este archivo se comporta exactamente igual que
// antes — DEMO nunca es true en el uso real de la app.
const DEMO = new URLSearchParams(location.search).get('demo') === '1';

let screen = 'login'; // login | login-error | select-course | loading | error | attendance | alta
let errorMsg = '';

let idToken = '';
let docenteNombre = '';
let cursoId = localStorage.getItem('cursoId') || '';
let cursoNombre = localStorage.getItem('cursoNombre') || '';
let cursoMeta = localStorage.getItem('cursoMeta') || '';

let cursos = [];
let cursoFiltro = '';

let students = [];
let attendance = {};
let attendanceSaved = {};
let cargadoInfo = { cargado: false, ultimaCarga: null, cargadoPor: '' };

let altaForm = { dni: '', nombre: '', telefono: '', error: '' };
let altaSaving = false;

let saveState = 'idle'; // idle | saving | saved
let statusMsg = '';

function todayLocal(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
let currentDate = todayLocal();

function formatDate(iso){
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('es-AR', { weekday:'short', day:'2-digit', month:'short' });
}
function formatDateRow(iso){
  const d = new Date(iso + 'T00:00:00');
  let s = d.toLocaleDateString('es-AR', { weekday:'long', day:'numeric', month:'long' }).replace(',', '');
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function isDirty(){
  const keys = Object.keys(attendance);
  if (keys.length !== Object.keys(attendanceSaved).length) return true;
  return keys.some(k => attendance[k] !== attendanceSaved[k]);
}

async function apiGet(params){
  const url = `${APPS_SCRIPT_URL}?${params}&idToken=${encodeURIComponent(idToken)}`;
  const res = await fetch(url);
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'Error desconocido.');
  return data;
}

// ---------- cola de guardados pendientes (offline) ----------
function getQueue(){
  try{ return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); }
  catch(e){ return []; }
}
function setQueue(q){ localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }
function queueSave(payloadConToken){
  const { idToken: _drop, ...sinToken } = payloadConToken;
  const q = getQueue().filter(p => !(p.cursoId === sinToken.cursoId && p.fecha === sinToken.fecha));
  q.push(sinToken);
  setQueue(q);
}
async function flushQueue(){
  const q = getQueue();
  if (!q.length) return;
  if (!idToken){ render(); return; }

  const restantes = [];
  const exitosos = [];
  for (const payloadSinToken of q){
    const payload = Object.assign({}, payloadSinToken, { idToken });
    try{
      const res = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
      const result = await res.json();
      if (!result.ok){
        if (/sesi[oó]n|token/i.test(result.error || '')){
          idToken = '';
          restantes.push(payloadSinToken);
          continue;
        }
        throw new Error(result.error || 'error');
      }
      exitosos.push(payloadSinToken);
    }catch(e){
      restantes.push(payloadSinToken);
    }
  }
  setQueue(restantes);

  // Si lo que se subió recién es justo lo que se está mirando en
  // pantalla, avisar explícitamente — antes quedaba en silencio y
  // parecía que nunca se había confirmado el guardado.
  const afectaVistaActual = screen === 'attendance' &&
    exitosos.some(p => p.cursoId === cursoId && p.fecha === currentDate);

  if (afectaVistaActual){
    await loadForDate(currentDate);
    statusMsg = `Guardado y verificado ✓ ${formatDate(currentDate)} — subido apenas volvió la señal.`;
    render();
    setTimeout(() => { statusMsg = ''; render(); }, 4000);
  } else {
    render();
  }
}

// ---------- arranque ----------
function esperarGoogleIdentity(intentos){
  return new Promise((resolve, reject) => {
    const check = (restantes) => {
      if (window.google && google.accounts && google.accounts.id) return resolve();
      if (restantes <= 0) return reject(new Error('No se pudo cargar el login de Google.'));
      setTimeout(() => check(restantes - 1), 150);
    };
    check(intentos);
  });
}

async function init(){
  if ('serviceWorker' in navigator){
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  }
  window.addEventListener('online', flushQueue);
  setInterval(flushQueue, 30000);

  if (DEMO){
    docenteNombre = 'Demo';
    cursos = [
      { id: 'demo-1', nombre: 'Electricidad Domiciliaria', sede: 'Sede Centro' },
      { id: 'demo-2', nombre: 'Gasista Matriculado',       sede: 'Sede Norte' }
    ];
    screen = 'select-course';
    render();

  screen = 'login';

  try{

    errorMsg = 'No se pudo cargar el botón de Google. Revisá tu conexión y recargá la página.';
    screen = 'login-error';
    render();
    return;
  }

}

// ---------- asistencia ----------
function aplicarAsistenciaCargada(data){
  cargadoInfo = { cargado: data.cargado, ultimaCarga: data.ultimaCarga, cargadoPor: data.cargadoPor };
  attendance = {};
  students.forEach(s => {
    attendance[s.dni] = (s.dni in data.asistencia) ? data.asistencia[s.dni] : AUSENTE;
  });
  attendanceSaved = Object.assign({}, attendance);
}

async function loadForDate(date){
  try{
    const data = await apiGet(`action=attendance&cursoId=${encodeURIComponent(cursoId)}&fecha=${date}`);
    aplicarAsistenciaCargada(data);
  }catch(e){
    cargadoInfo = { cargado: false, ultimaCarga: null, cargadoPor: '' };
    attendance = {};
    students.forEach(s => attendance[s.dni] = PRESENTE);
    attendanceSaved = Object.assign({}, attendance);
  }
  render();
}

function cambiarFecha(nuevaFecha, inputEl){
  if (isDirty()){
    const seguro = confirm('Tenés cambios sin guardar en esta fecha. Si cambiás de fecha ahora, se pierden.\n¿Querés continuar sin guardar?');
    if (!seguro){
      if (inputEl) inputEl.value = currentDate;
      return;
    }
  }
  currentDate = nuevaFecha;
  saveState = 'idle'; statusMsg = '';
  loadForDate(currentDate);
}

// ---------- guardado, con dos categorías de error (decisión de esta sesión) ----------
async function save(){
  if (saveState === 'saving') return;

  if (cargadoInfo.cargado){
    const aviso = `Esta fecha ya tiene una carga (${cargadoInfo.ultimaCarga}${cargadoInfo.cargadoPor ? ' — ' + cargadoInfo.cargadoPor : ''}).\n¿Confirmás que querés modificarla?`;
    if (!confirm(aviso)) return;
  }

  const payload = { cursoId, fecha: currentDate, asistencia: attendance, idToken };
  saveState = 'saving'; statusMsg = '';
  render();

  let res;
  try{
    res = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
  }catch(e){
    // sin señal / falla de red — se encola, se reintenta solo (igual que siempre)
    saveState = 'idle';
    queueSave(payload);
    attendanceSaved = Object.assign({}, attendance);
    statusMsg = 'Sin conexión — quedó guardado en este celular y se sube solo apenas vuelva la señal.';
    render();
    return;
  }

  let result;
  try{
    result = await res.json();
  }catch(e){
    // respuesta no interpretable — mismo tratamiento que falla de red
    saveState = 'idle';
    queueSave(payload);
    attendanceSaved = Object.assign({}, attendance);
    statusMsg = 'Sin conexión — quedó guardado en este celular y se sube solo apenas vuelva la señal.';
    render();
    return;
  }

  if (!result.ok){
    // el servidor respondió y rechazó — NO se encola (decisión de esta
    // sesión): reintentar sin que nada cambie no resuelve nada.
    saveState = 'idle';
    statusMsg = result.error || 'No se pudo guardar. Revisá e intentá de nuevo.';
    render();
    return;
  }

  saveState = 'saved';
  render();
  await loadForDate(currentDate); // deja attendanceSaved sincronizado
  const avisoIgnorados = result.ignorados > 0
    ? ` — ${result.ignorados} registro(s) ignorado(s) por no pertenecer a este curso`
    : '';
  statusMsg = `Guardado y verificado ✓ ${formatDate(currentDate)}${avisoIgnorados}`;
  render();
  setTimeout(() => { saveState = 'idle'; render(); }, 2200);
}

// Solo se usa en modo demo — simula a mano los tres resultados posibles
// de save(), sin tocar la red, para poder ver los tres estados del botón
// y del mensaje de estado sin tener el backend desplegado.
function demoSimulateSave(kind){
  if (kind === 'offline'){
    saveState = 'idle';
    attendanceSaved = Object.assign({}, attendance);
    statusMsg = 'Sin conexión — quedó guardado en este celular y se sube solo apenas vuelva la señal.';
  } else if (kind === 'rejected'){
    saveState = 'idle';
    statusMsg = 'No se pudo guardar. Revisá e intentá de nuevo.';
  } else if (kind === 'ok'){
    saveState = 'saved';
    statusMsg = `Guardado y verificado ✓ ${formatDate(currentDate)}`;
    attendanceSaved = Object.assign({}, attendance);
    setTimeout(() => { saveState = 'idle'; render(); }, 2200);
  }
  render();
}

function abrirAlta(){
  altaForm = { dni: '', nombre: '', telefono: '', error: '' };
  altaSaving = false;
  screen = 'alta';
  render();
}
function cancelarAlta(){
  screen = 'attendance';
  render();

async function confirmarAlta(){
  const dni = (altaForm.dni || '').replace(/\D/g, '');
  const nombre = (altaForm.nombre || '').trim();
  const telefono = (altaForm.telefono || '').trim();

  if (!dni || dni.length < 6){ altaForm.error = 'DNI inválido.'; render(); return; }
  if (!nombre){ altaForm.error = 'Falta el nombre.'; render(); return; }
  if (students.some(s => s.dni === dni)){
    altaForm.error = 'Ya hay un alumno con ese DNI en este curso.';
    render();
    return;
  }

  altaForm.error = '';
  altaSaving = true;
  render();

  if (DEMO){
    setTimeout(() => {
      students.push({ dni, name: nombre });
      students.sort((a, b) => a.name.localeCompare(b.name, 'es'));
      attendance[dni] = AUSENTE; // default ausente, consistente con la política general
      altaSaving = false;
      screen = 'attendance';
      render();
    }, 400);
    return;
  }

  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'altaAlumno', cursoId, dni, nombre, telefono, idToken })
    });
    const result = await res.json();
    if (!result.ok) throw new Error(result.error || 'No se pudo agregar.');

    students.push({ dni, name: nombre });
    students.sort((a, b) => a.name.localeCompare(b.name, 'es'));
    attendance[dni] = AUSENTE; // default ausente, consistente con la política general
    altaSaving = false;
    screen = 'attendance';
    render();
  }catch(e){
    altaSaving = false;
    altaForm.error = e.message || 'No se pudo agregar. Revisá tu conexión.';
    render();
  }
}

function pendingBannerHTML(){

  if (!n) return '';

  const verbo  = n === 1 ? 'subirla'    : 'subirlas';
  if (!idToken){

  }
  return `<div class="banner-pending">${sujeto} sin subir todavía — se reintenta solo cuando haya señal.</div>`;
}

// Reata el comportamiento del switch (deslizamiento + brillo) sobre
// los elementos recién insertados por render(). No llama a render()
// en el click — actualiza `attendance` y el tablero de stats en el
// lugar, para no destruir la animación de deslizamiento reiniciando
// el DOM en cada toque.
function wireSwitches(){
  document.querySelectorAll('.switch').forEach(function(sw){
    const dni = sw.dataset.dni;
    sw.setAttribute('role', 'switch');
    sw.setAttribute('tabindex', '0');
    const isP = sw.classList.contains('is-p');
    sw.setAttribute('aria-checked', isP ? 'true' : 'false');
    const check = sw.querySelector('.check-glow');
    const cell = sw.querySelector('.switch-cell');
    const caption = sw.querySelector('.switch-caption');
    let captionTimer = null;

    if (caption) caption.style.left = isP ? '36px' : '68px';
    if (isP){ if (check) check.classList.add('lit'); cell.classList.add('lit'); }

    cell.addEventListener('transitionend', function(e){
      if (e.propertyName !== 'left') return;
      const nowLit = sw.classList.contains('is-p');
      if (check) check.classList.toggle('lit', nowLit);
      cell.classList.toggle('lit', nowLit);
    });

    function doToggle(){
      const nowP = sw.classList.toggle('is-p');
      sw.classList.toggle('is-a', !nowP);
      sw.setAttribute('aria-checked', nowP ? 'true' : 'false');
      if (check) check.classList.remove('lit');
      cell.classList.remove('lit');

      attendance[dni] = nowP ? PRESENTE : AUSENTE;
      updateStatCounts();

      if (caption){
        if (captionTimer) clearTimeout(captionTimer);
        captionTimer = setTimeout(function(){
          caption.style.left = nowP ? '36px' : '68px';
          caption.textContent = nowP ? 'presente' : 'ausente';
          captionTimer = null;
        }, 100);
      }
    }
    sw.addEventListener('click', doToggle);
    sw.addEventListener('keydown', function(e){
      if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); doToggle(); }
    });
  });
}

function updateStatCounts(){
  const presentCount = students.filter(s => attendance[s.dni] === PRESENTE).length;
  const absentCount = students.length - presentCount;
  const pEl = document.getElementById('presentCount');
  const aEl = document.getElementById('absentCount');
  if (pEl) pEl.textContent = presentCount;
  if (aEl) aEl.textContent = absentCount;
}

        <div class="date-row mono">
          <span id="dateLabel">${formatDateRow(currentDate)}</span>
          <input type="date" id="datePicker" value="${currentDate}" max="${todayLocal()}" style="position:absolute; inset:0; opacity:0; cursor:pointer; border:0; padding:0; margin:0; width:100%; height:100%; z-index:2;">
          <span>▾</span>
        </div>

        ${pendingBannerHTML()}
        ${banner}

        <div class="bulk-actions">
          <button class="alta-cancel" id="allPresent">Marcar todos presentes</button>
        </div>

        <div class="roster">
          ${students.map(s => `
            <div class="student">
              <div class="sname">${s.name}</div>
              ${switchHTML(s)}
            </div>`).join('')}
        </div>

        <div class="save-bar">
          <button class="save-btn ${saveState==='saving'?'is-saving':''} ${saveState==='saved'?'is-saved':''}" id="saveBtn">
            <span class="save-dot"></span><span class="save-btn-label">${saveState==='saving'?'Guardando':saveState==='saved'?'Guardado':'Guardar asistencia'}</span>
          </button>
          <div class="status" id="status">${statusMsg}</div>
          <button class="add-btn" id="abrirAltaBtn"><span class="save-dot"></span><span class="save-btn-label">Agregar alumno</span></button>
          ${DEMO ? `
            <div style="margin-top:16px; padding:10px 12px; border:1px dashed var(--muted-2);">
              <div style="font-family:var(--mono); font-size:8.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted-2); margin-bottom:8px;">Modo demo — simular resultado de guardar</div>
              <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <button class="alta-cancel" id="demoOffline">Sin señal</button>
                <button class="alta-cancel" id="demoRejected">Rechazo del servidor</button>
                <button class="alta-cancel" id="demoOk">Guardado ok</button>
              </div>
            </div>
          ` : ''}
        </div>
      `}
      <button class="alta-cancel" id="cambiarCursoBtn" style="display:block; margin:18px auto 0;">Cambiar de curso</button>
    </div>
  `;

  document.getElementById('cambiarCursoBtn').addEventListener('click', changeCourse);
  document.getElementById('abrirAltaBtn')?.addEventListener('click', abrirAlta);

  if (!sinAlumnos){
    document.getElementById('datePicker').addEventListener('change', e => {
      cambiarFecha(e.target.value, e.target);
    });
    document.getElementById('allPresent').addEventListener('click', () => setAll(PRESENTE));
    document.getElementById('saveBtn').addEventListener('click', save);
    wireSwitches();
    if (DEMO){
      document.getElementById('demoOffline').addEventListener('click', () => demoSimulateSave('offline'));
      document.getElementById('demoRejected').addEventListener('click', () => demoSimulateSave('rejected'));
      document.getElementById('demoOk').addEventListener('click', () => demoSimulateSave('ok'));
    }
  }
}

init();
</script>
</body>
</html>
